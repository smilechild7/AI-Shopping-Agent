# 역할: Render에서 API와 프런트엔드를 함께 제공할 Node 웹 서비스의 배포 구성을 정의한다.
# 빌드·DB 생성·서버 시작 명령, 상태 확인 경로와 환경변수를 지정한다.

services:
  - type: web
    name: levit-problem-solver
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npm run db:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: OPENAI_API_KEY
        sync: false
